<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4F46E5">
    <meta name="description" content="QUALITAT S.A.C - Centro de Control & Sustentos">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="OpsControl">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <title>QUALITAT S.A.C - OpsControl</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .bg-gradient-main {
            background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 50%, #DB2777 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="bg-gradient-main min-h-screen text-gray-800 font-sans antialiased selection:bg-pink-500 selection:text-white">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="min-h-screen flex flex-col justify-center items-center p-6">
        <div class="glass-card w-full max-w-md p-8 rounded-3xl shadow-2xl transform transition-all">
            <div class="flex justify-center mb-6">
                <div class="w-20 h-20 bg-gradient-to-tr from-indigo-600 to-pink-500 rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-500/40">
                    <i class="fa-solid fa-headset text-4xl text-white"></i>
                </div>
            </div>
            
            <h1 class="text-3xl font-black text-center text-gray-900 tracking-tight mb-1">OpsControl</h1>
            <p class="text-center text-gray-500 text-sm font-medium mb-8">QUALITAT S.A.C - Centro de Control</p>

            <div class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">Nombre y Apellidos</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input id="userName" type="text" placeholder="Ej. Carlos Mendoza" 
                            class="w-full pl-11 pr-4 py-3.5 bg-gray-50 border border-gray-200 rounded-2xl focus:bg-white focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition font-medium text-gray-800">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">Rol de Acceso</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400">
                            <i class="fa-solid fa-shield-halved"></i>
                        </span>
                        <select id="userRole" class="w-full pl-11 pr-4 py-3.5 bg-gray-50 border border-gray-200 rounded-2xl focus:bg-white focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition font-medium text-gray-800 appearance-none">
                            <option value="operador">Operador (Móvil)</option>
                            <option value="supervisor">Supervisor (Panel Gerencial)</option>
                        </select>
                        <span class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-gray-400">
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </span>
                    </div>
                </div>

                <button onclick="login()" class="w-full mt-2 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-purple-500/30 hover:opacity-95 active:scale-[0.98] transition">
                    Ingresar al Sistema <i class="fa-solid fa-arrow-right ml-2"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="mainApp" class="hidden min-h-screen flex flex-col">
        <nav class="bg-white/90 backdrop-blur-md sticky top-0 z-50 border-b border-gray-100 px-6 py-4 flex justify-between items-center shadow-sm">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-lg shadow-md shadow-indigo-500/20" id="userAvatar">
                    OP
                </div>
                <div>
                    <h2 id="headerName" class="font-bold text-gray-900 text-sm leading-tight"></h2>
                    <span id="headerRole" class="text-xs text-indigo-600 font-semibold uppercase tracking-wider"></span>
                </div>
            </div>
            <button onclick="location.reload()" class="bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center">
                <i class="fa-solid fa-right-from-bracket mr-1.5"></i> Salir
            </button>
        </nav>

        <div id="content" class="p-4 max-w-lg mx-auto w-full flex-grow">
            <!-- Dynamic Content -->
        </div>
    </div>

    <script>
        // Registrar Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
        }

        let currentUser = { name: "", role: "" };

        function login() {
            const nameInput = document.getElementById('userName').value.trim();
            const roleInput = document.getElementById('userRole').value;

            if (!nameInput) {
                alert("Por favor ingresa tu Nombre y Apellidos.");
                return;
            }

            currentUser.name = nameInput;
            currentUser.role = roleInput;

            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');

            document.getElementById('headerName').innerText = currentUser.name;
            document.getElementById('headerRole').innerText = currentUser.role;
            document.getElementById('userAvatar').innerText = currentUser.name.substring(0, 2).toUpperCase();

            if (currentUser.role === 'operador') {
                loadOperatorView();
            } else {
                loadSupervisorView();
            }
        }

        function toggleOtroMotivo(val) {
            const extraInput = document.getElementById('campoOtroMotivo');
            if (val === 'Otros') {
                extraInput.classList.remove('hidden');
            } else {
                extraInput.classList.add('hidden');
            }
        }

        function previewCameraPhoto(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imgBox = document.getElementById('photoPreview');
                    imgBox.src = e.target.result;
                    imgBox.classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        function loadOperatorView() {
            document.getElementById('content').innerHTML = `
                <div class="space-y-4">
                    <div class="glass-card p-6 rounded-3xl shadow-xl">
                        <div class="flex items-center space-x-2 mb-4 text-indigo-600">
                            <i class="fa-solid fa-triangle-exclamation text-xl"></i>
                            <h2 class="text-lg font-extrabold text-gray-900">Reportar Sustento</h2>
                        </div>

                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Motivo de Incidencia</label>
                                <select id="motivoSelect" onchange="toggleOtroMotivo(this.value)" class="w-full p-3.5 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 text-sm font-semibold text-gray-800">
                                    <option value="Sola en la central de emergencias">Sola en la central de emergencias</option>
                                    <option value="Falla en el sistema wyldix">Falla en el sistema wyldix</option>
                                    <option value="Carga de llamadas no me deja contestar">Carga de llamadas no me deja contestar</option>
                                    <option value="Personal en servicios higienicos">Personal en servicios higienicos</option>
                                    <option value="Se fue el internet">Se fue el internet</option>
                                    <option value="Se fue la luz">Se fue la luz</option>
                                    <option value="Otros">Otros (Explicar abajo)</option>
                                </select>
                            </div>

                            <div id="campoOtroMotivo" class="hidden">
                                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Explicación del Motivo</label>
                                <input type="text" id="otroTexto" placeholder="Detalla la razón..." class="w-full p-3.5 bg-gray-50 border border-gray-200 rounded-2xl text-sm font-medium">
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Detalles del Suceso</label>
                                <textarea id="detallesTexto" rows="3" placeholder="Escribe un comentario breve..." class="w-full p-3.5 bg-gray-50 border border-gray-200 rounded-2xl text-sm font-medium outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Sustento Visual (Foto)</label>
                                <label class="flex flex-col items-center justify-center p-4 border-2 border-dashed border-indigo-200 rounded-2xl bg-indigo-50/50 hover:bg-indigo-50 cursor-pointer transition">
                                    <i class="fa-solid fa-camera text-3xl text-indigo-600 mb-1"></i>
                                    <span class="text-xs font-bold text-indigo-700">Tomar Foto con el Celular</span>
                                    <input type="file" accept="image/*" capture="environment" onchange="previewCameraPhoto(event)" class="hidden">
                                </label>
                                <img id="photoPreview" class="hidden mt-3 w-full h-48 object-cover rounded-2xl shadow-md border-2 border-white">
                            </div>

                            <button onclick="enviarSustento()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-2xl shadow-lg shadow-indigo-500/30 transition active:scale-[0.98] flex items-center justify-center">
                                <i class="fa-solid fa-paper-plane mr-2"></i> Enviar Sustento
                            </button>
                        </div>
                    </div>

                    <div class="glass-card p-5 rounded-3xl shadow-xl space-y-3">
                        <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                            <span class="font-bold text-sm text-gray-900"><i class="fa-solid fa-comments text-indigo-500 mr-2"></i> Chat con Supervisor</span>
                            <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></span>
                        </div>
                        <div class="h-32 overflow-y-auto space-y-2 p-1 text-xs">
                            <div class="bg-gray-100 p-2.5 rounded-2xl max-w-[80%]">
                                <span class="font-bold text-gray-700 block text-[10px]">Supervisor</span>
                                Por favor adjunten foto del error de Wildix si persiste.
                            </div>
                        </div>
                        <div class="flex space-x-2">
                            <input type="text" id="mensajeChat" placeholder="Escribir mensaje..." class="flex-grow p-3 bg-gray-50 border border-gray-200 rounded-xl text-xs outline-none">
                            <button onclick="enviarMensaje()" class="bg-indigo-600 text-white px-4 rounded-xl font-bold text-xs"><i class="fa-solid fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>
            `;
        }

        function enviarSustento() {
            const motivo = document.getElementById('motivoSelect').value;
            const detalles = document.getElementById('detallesTexto').value;
            const foto = document.getElementById('photoPreview').src;
            
            if (!detalles) {
                alert("Por favor completa los detalles del suceso.");
                return;
            }
            
            alert(`✅ Sustento enviado correctamente\n\nMotivo: ${motivo}\nDetalles: ${detalles}\nFoto: ${foto ? 'Adjunta' : 'Sin foto'}`);
            document.getElementById('detallesTexto').value = '';
            document.getElementById('photoPreview').classList.add('hidden');
        }

        function enviarMensaje() {
            const mensaje = document.getElementById('mensajeChat').value.trim();
            if (mensaje) {
                alert(`Mensaje enviado: ${mensaje}`);
                document.getElementById('mensajeChat').value = '';
            }
        }

        function loadSupervisorView() {
            document.getElementById('content').innerHTML = `
                <div class="space-y-4">
                    <div class="glass-card p-6 rounded-3xl shadow-xl">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-lg font-black text-gray-900"><i class="fa-solid fa-chart-line text-pink-500 mr-2"></i> Panel Gerencial</h2>
                            <span class="bg-emerald-100 text-emerald-700 text-[10px] font-extrabold px-2.5 py-1 rounded-full">EN VIVO</span>
                        </div>

                        <div class="grid grid-cols-2 gap-3 mb-4">
                            <div class="bg-gradient-to-br from-red-500 to-rose-600 p-4 rounded-2xl text-white shadow-lg shadow-red-500/20">
                                <span class="text-[10px] font-bold opacity-80 uppercase tracking-wider block">Incidencias Hoy</span>
                                <span class="text-3xl font-black">14</span>
                            </div>
                            <div class="bg-gradient-to-br from-indigo-500 to-purple-600 p-4 rounded-2xl text-white shadow-lg shadow-indigo-500/20">
                                <span class="text-[10px] font-bold opacity-80 uppercase tracking-wider block">Operadores Activos</span>
                                <span class="text-3xl font-black">8</span>
                            </div>
                        </div>

                        <button onclick="descargarReporte()" class="w-full bg-gray-900 text-white font-bold py-3.5 rounded-2xl shadow-lg text-xs flex items-center justify-center">
                            <i class="fa-solid fa-file-excel text-emerald-400 text-sm mr-2"></i> Exportar Reporte Gerencial (.XLSX)
                        </button>
                    </div>

                    <div class="glass-card p-5 rounded-3xl shadow-xl space-y-3">
                        <h3 class="font-bold text-sm text-gray-900 mb-2">Últimos Sustentos Recibidos</h3>
                        <div class="space-y-2">
                            <div class="p-3.5 bg-gray-50 rounded-2xl border border-gray-100 space-y-1">
                                <div class="flex justify-between items-center">
                                    <span class="font-bold text-xs text-gray-900">Maria Fernandez</span>
                                    <span class="text-[10px] font-bold bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full">Pendiente</span>
                                </div>
                                <p class="text-xs text-indigo-600 font-semibold">Falla en el sistema wyldix</p>
                                <p class="text-[11px] text-gray-500">Foto adjunta disponible • 10:42 AM</p>
                            </div>
                            <div class="p-3.5 bg-gray-50 rounded-2xl border border-gray-100 space-y-1">
                                <div class="flex justify-between items-center">
                                    <span class="font-bold text-xs text-gray-900">Juan Carlos Lopez</span>
                                    <span class="text-[10px] font-bold bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full">Revisado</span>
                                </div>
                                <p class="text-xs text-indigo-600 font-semibold">Personal en servicios higienicos</p>
                                <p class="text-[11px] text-gray-500">Regresa en 5 min • 10:15 AM</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function descargarReporte() {
            alert('📊 Descargando reporte Excel gerencial...');
        }
    </script>
</body>
</html>
